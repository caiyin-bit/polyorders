name: live

on:
  schedule:
    - cron: "23 */2 * * *" # 每 2 小时,错开整点
  workflow_dispatch:

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 应用数据库迁移
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: 抓取 Top N 持仓与成交
        run: pnpm exec tsx src/fetch/index.ts --step=5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
