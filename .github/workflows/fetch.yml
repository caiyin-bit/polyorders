name: fetch

# 定时抓取在首尔 VPS(docker-compose.vps.yml 的 scheduler),此工作流仅手动兜底。
# 2026-08-15 数据库迁入 VPS 内网后 runner 无法直连,改为 SSH 触发 VPS 上执行:
# 复用 deploy.yml 同一把强制命令密钥,分发与白名单校验见 scripts/vps-release.sh
on:
  workflow_dispatch:
    inputs:
      step:
        description: "抓取步骤:all(全量)/ 1-5 / watch"
        required: false
        default: "all"
        type: choice
        options: ["all", "1", "2", "3", "4", "5", "watch"]

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 全量抓取约 3 小时,留余量
    steps:
      - name: SSH 触发 VPS 抓取
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          STEP: ${{ inputs.step }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes \
            root@141.164.53.169 "fetch ${STEP:-all}"
