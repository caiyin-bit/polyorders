name: fetch

# 定时抓取已迁至首尔 VPS(docker-compose.vps.yml 的 scheduler),
# 此工作流仅保留手动触发作为兜底
on:
  workflow_dispatch:
    inputs:
      args:
        description: "fetch 参数(如 --step=4、--force)"
        required: false
        default: ""

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 全量抓取约 3 小时,留余量
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 应用数据库迁移
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: 运行抓取管线
        run: pnpm exec tsx src/fetch/index.ts ${{ inputs.args }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
