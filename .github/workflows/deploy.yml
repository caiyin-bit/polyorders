name: deploy

# 标准 CI/CD:构建一次不可变镜像,VPS 只拉取切换,不在生产机 build。
# 回滚:手动 dispatch 并填入旧 git 短 sha(GHCR 保留最近 5 个版本)。
# 手动兜底(Actions 不可用时):ssh vps 后跑 scripts/vps-deploy.sh 现场构建
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      tag:
        description: "回滚用:已存在的镜像 tag(git 短 sha)。留空则构建并部署当前 HEAD"
        required: false
        default: ""

# 串行化部署,连续 push 不撞车;不取消进行中的(部署做一半被掐比排队更糟)
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_APP: ghcr.io/caiyin-bit/polyorders
  IMAGE_SCHEDULER: ghcr.io/caiyin-bit/polyorders-scheduler

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    # 回滚(指定已存在的 tag)时跳过构建
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送 app 镜像(web/watcher 共用)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_APP }}:latest
          secrets: database_url=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 构建并推送 scheduler 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: scheduler
          push: true
          tags: |
            ${{ env.IMAGE_SCHEDULER }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_SCHEDULER }}:latest
          secrets: database_url=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, build]
    # build 在回滚场景下 skipped 也放行,test 必须绿
    if: ${{ !cancelled() && needs.test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH 触发 VPS 发布(强制命令,只能跑 vps-release.sh)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_SHA::7}}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy -o BatchMode=yes \
            root@141.164.53.169 "$TAG"

  # GHCR 私有仓库有 500MB 存储配额,只保留最近 5 个版本
  cleanup:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: polyorders
          package-type: container
          min-versions-to-keep: 5
      - uses: actions/delete-package-versions@v5
        with:
          package-name: polyorders-scheduler
          package-type: container
          min-versions-to-keep: 5
