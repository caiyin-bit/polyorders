services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: polyorders
      POSTGRES_USER: polyorders
      POSTGRES_PASSWORD: polyorders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyorders -d polyorders"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm db:migrate && pnpm dev"
    environment:
      DATABASE_URL: postgres://polyorders:polyorders@db:5432/polyorders
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
  pnpm_store:
