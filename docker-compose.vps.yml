# 首尔 VPS 生产编排:caddy(TLS 入口)+ web(Next.js)+ scheduler(定时抓取)
# 数据库使用 Supabase(.env 中 DATABASE_URL),本机不存数据
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      target: app
      args:
        DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000" # 仅本机调试用,外网入口走 caddy

  scheduler:
    build:
      context: .
      target: scheduler
      args:
        DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    env_file: .env
    volumes:
      - fetch_logs:/var/log/fetch

volumes:
  caddy_data:
  caddy_config:
  fetch_logs:
