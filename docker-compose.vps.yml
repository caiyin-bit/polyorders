# 首尔 VPS 生产编排:db(Postgres)+ caddy(TLS 入口)+ web(Next.js)+ scheduler(定时抓取)
# 数据库 2026-08-15 从 Supabase 迁入本机:仅在 compose 内网监听,不映射宿主端口,
# 外部访问一律走 SSH 隧道。DATABASE_URL 在 .env 中指向 db:5432
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: polyorders
      POSTGRES_USER: polyorders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置(见 .env)}
    # 2C/4G 机器上与 web/scheduler/watcher 共存,内存参数保守取值
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=192MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyorders -d polyorders"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    # 正常发布走 GHCR 镜像(Actions 构建推送,vps-release.sh 拉取);
    # build 仅供断网兜底的 vps-deploy.sh 现场构建,产物同名覆盖
    image: ghcr.io/caiyin-bit/polyorders:${IMAGE_TAG:-latest}
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      # 容器网络无 IPv6,Node fetch 对 AAAA 记录不回退,强制 IPv4 优先
      NODE_OPTIONS: --dns-result-order=ipv4first
    ports:
      - "127.0.0.1:3000:3000" # 仅本机调试用,外网入口走 caddy
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: ghcr.io/caiyin-bit/polyorders-scheduler:${IMAGE_TAG:-latest}
    build:
      context: .
      target: scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - fetch_logs:/var/log/fetch
    depends_on:
      db:
        condition: service_healthy

  # RTDS 实时 watcher:常驻 WebSocket,关注池地址的秒级成交感知。
  # 与 scheduler 共用 app 镜像;5 分钟轮询仍是正确性兜底,此服务挂掉不影响数据完整性。
  watcher:
    image: ghcr.io/caiyin-bit/polyorders:${IMAGE_TAG:-latest}
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      NODE_OPTIONS: --dns-result-order=ipv4first
    command: ["pnpm", "watch:rtds"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  fetch_logs:
  pgdata:
