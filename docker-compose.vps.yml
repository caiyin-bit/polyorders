# 首尔 VPS 生产编排:caddy(TLS 入口)+ web(Next.js)+ scheduler(定时抓取)
# 数据库使用 Supabase(.env 中 DATABASE_URL),本机不存数据
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      target: app
      args:
        DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      # 容器网络无 IPv6,Node fetch 对 AAAA 记录不回退,强制 IPv4 优先
      NODE_OPTIONS: --dns-result-order=ipv4first
    ports:
      - "127.0.0.1:3000:3000" # 仅本机调试用,外网入口走 caddy

  scheduler:
    build:
      context: .
      target: scheduler
      args:
        DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - fetch_logs:/var/log/fetch

  # RTDS 实时 watcher:常驻 WebSocket,关注池地址的秒级成交感知。
  # 与 scheduler 共用 app 镜像;5 分钟轮询仍是正确性兜底,此服务挂掉不影响数据完整性。
  watcher:
    build:
      context: .
      target: app
      args:
        DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      NODE_OPTIONS: --dns-result-order=ipv4first
    command: ["pnpm", "watch:rtds"]

volumes:
  caddy_data:
  caddy_config:
  fetch_logs:
